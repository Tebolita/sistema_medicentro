<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>SistemaMedicentro</title>
    <script>
      // Aplica el tema guardado antes de pintar (evita el destello claro).
      try {
        var t = localStorage.getItem('tema');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- display=optional (no "swap"): evita que Roboto reemplace la fuente
         de respaldo DESPUÉS de que Angular Material ya midió el ancho del
         recorte ("notch") del borde de los campos con outline — si el texto
         cambia de ancho tras esa medición, el borde queda cortando el texto
         (visto en los labels "Usuario *" / "Código *" del login). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=optional"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
