<h2 mat-dialog-title>
  <mat-icon class="dialog-title-icon">monitor_heart</mat-icon>
  Agregar control de signos
</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content class="dialog-form-grid">
    <mat-form-field appearance="outline">
      <mat-label>P/A (opcional)</mat-label>
      <input matInput placeholder="Ej. 120/80" formControlName="presionArterial" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Temperatura (opcional)</mat-label>
      <input matInput type="number" step="0.1" formControlName="temperatura" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>F.R. (opcional)</mat-label>
      <input matInput type="number" formControlName="frecuenciaRespiratoria" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Observaciones (opcional)</mat-label>
      <textarea matInput formControlName="observaciones" rows="3"></textarea>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton type="button" (click)="cancelar()">Cancelar</button>
    <button matButton="filled" type="submit">
      <mat-icon>add</mat-icon>
      Registrar
    </button>
  </mat-dialog-actions>
</form>
