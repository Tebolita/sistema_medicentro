<h2 mat-dialog-title>
  <mat-icon class="dialog-title-icon">edit_note</mat-icon>
  Agregar nota de evolución
</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content class="dialog-form-grid">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Evolución</mat-label>
      <textarea matInput formControlName="evolucion" rows="5" placeholder="Ej. Paciente estable, sin fiebre, tolera vía oral"></textarea>
      @if (form.controls.evolucion.invalid && form.controls.evolucion.touched) {
        <mat-error>Este campo es obligatorio</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton type="button" (click)="cancelar()">Cancelar</button>
    <button matButton="filled" type="submit">
      <mat-icon>add</mat-icon>
      Registrar
    </button>
  </mat-dialog-actions>
</form>
