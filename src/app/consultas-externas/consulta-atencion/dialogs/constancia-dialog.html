<h2 mat-dialog-title>
  <mat-icon class="dialog-title-icon">description</mat-icon>
  {{ esNuevo ? 'Generar constancia médica' : 'Editar constancia médica' }}
</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content class="dialog-form-grid">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Diagnóstico (opcional)</mat-label>
      <input matInput formControlName="diagnostico" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Contenido de la constancia</mat-label>
      <textarea matInput formControlName="contenido" rows="5"></textarea>
      @if (form.controls.contenido.invalid && form.controls.contenido.touched) {
        <mat-error>Escribe el contenido de la constancia</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton type="button" (click)="cancelar()">Cancelar</button>
    <button matButton="filled" type="submit">
      <mat-icon>save</mat-icon>
      {{ esNuevo ? 'Generar' : 'Guardar cambios' }}
    </button>
  </mat-dialog-actions>
</form>
