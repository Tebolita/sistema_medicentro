<h2 mat-dialog-title>
  <mat-icon class="dialog-title-icon">assignment</mat-icon>
  {{ esNuevo ? 'Datos de la consulta' : 'Editar datos de la consulta' }}
</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content class="dialog-form-grid">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Diagnóstico</mat-label>
      <textarea matInput formControlName="diagnostico" rows="2"></textarea>
      @if (form.controls.diagnostico.invalid && form.controls.diagnostico.touched) {
        <mat-error>El diagnóstico es obligatorio</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Notas / signos vitales (opcional)</mat-label>
      <textarea matInput formControlName="notas" rows="3"></textarea>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton type="button" (click)="cancelar()">Cancelar</button>
    <button matButton="filled" type="submit">
      <mat-icon>save</mat-icon>
      Guardar
    </button>
  </mat-dialog-actions>
</form>
