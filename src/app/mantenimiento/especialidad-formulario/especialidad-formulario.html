<div class="form-page">
  <div class="page-header">
    <a routerLink="/home/mantenimiento/especialidades" class="back-link">
      <mat-icon>arrow_back</mat-icon>
      Especialidades
    </a>
    <h1>{{ esNueva() ? 'Nueva especialidad' : 'Editar especialidad' }}</h1>
  </div>

  <form [formGroup]="form" (ngSubmit)="guardar()" class="form-panel">
    <div class="form-grid">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="nombre" placeholder="Ej. Pediatría" />
        @if (form.controls.nombre.invalid && form.controls.nombre.touched) {
          <mat-error>Requerido</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Descripción (opcional)</mat-label>
        <input matInput formControlName="descripcion" />
      </mat-form-field>
    </div>

    @if (registro()) {
      <app-auditoria-info
        [fechaCreacion]="registro()!.fechaCreacion"
        [idUsuarioCreacion]="registro()!.idUsuarioCreacion"
        [fechaModificacion]="registro()!.fechaModificacion"
        [idUsuarioModificacion]="registro()!.idUsuarioModificacion"
      />
    }

    @if (errorMsg()) {
      <p class="form-error">{{ errorMsg() }}</p>
    }

    <div class="form-actions">
      <a matButton routerLink="/home/mantenimiento/especialidades">Cancelar</a>
      <button matButton="filled" type="submit" [disabled]="guardando()">
        <mat-icon>save</mat-icon>
        Guardar
      </button>
    </div>
  </form>
</div>
