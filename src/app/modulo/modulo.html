@if (section(); as s) {
  <div class="module-page" [style.--accent]="s.color">
    <div class="module-hero">
      <div class="module-hero-icon">
        <mat-icon>{{ s.icon }}</mat-icon>
      </div>
      <div class="module-hero-text">
        <h1>{{ s.title }}</h1>
        <p>{{ s.description }}</p>
      </div>
    </div>

    <div class="module-grid">
      @for (item of s.items; track item.label) {
        <a
          class="module-card"
          [class.disabled]="!item.route"
          [routerLink]="item.route || null"
          [queryParams]="item.queryParams || null"
          [matTooltip]="item.route ? '' : 'Próximamente'"
          matTooltipPosition="above"
        >
          <div class="module-card-icon">
            <mat-icon>{{ item.icon }}</mat-icon>
          </div>
          <span class="module-card-label">{{ item.label }}</span>
        </a>
      }
    </div>
  </div>
} @else {
  <div class="module-not-found">
    <mat-icon>help_outline</mat-icon>
    <p>Módulo no encontrado.</p>
  </div>
}
